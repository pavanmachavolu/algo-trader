services:
  mysql:
    image: mysql:8.0
    container_name: algo-trader-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: algo_trader
      MYSQL_USER: trader
      MYSQL_PASSWORD: traderpass
    ports:
      - "3306:3306"
    volumes:
      - ./docker-volumes/mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algo-trader-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algo-trader-backend
    ports:
      - "8080:8080"
      - "8888:8888"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: trader
      DB_PASSWORD: traderpass
      DB_NAME: algo_trader
    env_file:
      - backend/.env
    volumes:
      - ./backend/.env:/root/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - algo-trader-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algo-trader-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - algo-trader-network
    restart: unless-stopped

networks:
  algo-trader-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
